<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>VESTORO — варианты шрифтов</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/main.css">
  <script src="assets/js/fonts.js"></script>
  <style>
    .fonts { padding: 64px var(--gutter) 96px; color: var(--navy); }
    .fonts__head { max-width: 760px; margin: 0 auto 56px; text-align: center; }
    .fonts__head h1 { margin: 16px 0 0; font: 400 clamp(32px, 4vw, 48px)/1.1 "Cormorant Garamond", serif; }
    .fonts__head p { margin: 16px 0 0; color: var(--stone); }
    .variant { max-width: 1240px; margin: 0 auto 48px; border: 1px solid var(--line); background: var(--ivory-2); }
    .variant__bar { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 24px; padding: 18px 24px; border-bottom: 1px solid var(--line); }
    .variant__num { font: 500 10px/1 var(--sans); letter-spacing: .22em; text-transform: uppercase; color: var(--gold); }
    .variant__name { margin: 6px 0 0; font: 500 16px/1.3 var(--sans); }
    .variant__note { margin: 4px 0 0; font-size: 13px; color: var(--muted); }
    .variant__open { font: 500 11px/1 var(--sans); letter-spacing: .18em; text-transform: uppercase; border-bottom: 1px solid currentColor; padding-bottom: 6px; white-space: nowrap; }
    .variant__open:hover { color: var(--gold); }
    .demo { display: grid; grid-template-columns: 1.1fr 1fr; }
    .demo__hero { position: relative; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; min-height: 380px; padding: 48px 32px; color: #fff; background: var(--navy-deep); overflow: hidden; }
    .demo__hero img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: .35; }
    .demo__hero > * { position: relative; }
    .demo__brand { font-size: 40px; line-height: 1; letter-spacing: .12em; padding-left: .12em; }
    .demo__eyebrow { margin: 28px 0 0; font: 500 11px/1.4 var(--sans); letter-spacing: .3em; text-transform: uppercase; color: var(--gold-light); }
    .demo__title { margin: 16px 0 0; font-size: calc(clamp(34px, 4vw, 56px) * var(--serif-scale)); line-height: 1.04; }
    .demo__title span { display: block; font-style: italic; }
    .demo__body { padding: 40px 36px; }
    .demo__h2 { margin: 12px 0 0; font-size: calc(clamp(30px, 3vw, 44px) * var(--serif-scale)); line-height: 1.08; }
    .demo__body p:not(.eyebrow) { margin: 16px 0 0; font-size: 15px; line-height: 1.7; color: var(--stone); }
    .demo__list { margin: 24px 0 0; padding: 0; list-style: none; display: grid; grid-template-columns: 1fr 1fr; gap: 0 24px; }
    .demo__list li { padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 21px; line-height: 1.2; }
    @media (max-width: 860px) {
      .demo { grid-template-columns: 1fr; }
      .demo__hero { min-height: 300px; padding: 40px 16px; }
      .demo__body { padding: 32px 16px; }
      .variant__bar { padding: 16px; }
    }
  </style>
</head>
<body>
  <main class="fonts">
    <div class="fonts__head">
      <p class="eyebrow">VESTORO · шрифты заголовков</p>
      <h1>Один блок в разных шрифтах</h1>
      <p>Текст, кнопки и подписи остаются как есть — меняется только шрифт заголовков. Каждый вариант можно открыть на всей главной: внизу страницы будет переключатель.</p>
    </div>
    <div id="variants"></div>
  </main>

  <template id="tpl">
    <section class="variant">
      <div class="variant__bar">
        <div>
          <span class="variant__num"></span>
          <p class="variant__name"></p>
          <p class="variant__note"></p>
        </div>
        <a class="variant__open" href="#">Вся главная в этом шрифте →</a>
      </div>
      <div class="demo">
        <div class="demo__hero">
          <img src="assets/img/hero-master.jpg" alt="">
          <span class="demo__brand f">VESTORO</span>
          <p class="demo__eyebrow">Ателье VESTORO</p>
          <h2 class="demo__title f">Индивидуальный пошив <span>с 1993 года</span></h2>
        </div>
        <div class="demo__body">
          <p class="eyebrow">Более 7 000 тканей</p>
          <h3 class="demo__h2 f">Ткани с мировым именем</h3>
          <p>С 2000-х годов VESTORO является официальным партнёром ведущих мировых производителей тканей: Loro Piana, Ermenegildo Zegna, Scabal, Dormeuil.</p>
          <ul class="demo__list">
            <li class="f">Деловой костюм</li>
            <li class="f">Пиджаки</li>
            <li class="f">Рубашки</li>
            <li class="f">Аксессуары</li>
          </ul>
        </div>
      </div>
    </section>
  </template>

  <script>
    const wrap = document.getElementById('variants');
    const tpl = document.getElementById('tpl');
    window.VESTORO_FONTS.forEach((font, i) => {
      window.vestoroLoadFont(font);
      const node = tpl.content.cloneNode(true);
      node.querySelector('.variant').style.setProperty('--serif-scale', font.scale || 1);
      node.querySelector('.variant__num').textContent = `Вариант ${i + 1}`;
      node.querySelector('.variant__name').textContent = font.name;
      node.querySelector('.variant__note').textContent = font.note;
      node.querySelector('.variant__open').href = `./?font=${font.key}`;
      node.querySelectorAll('.f').forEach((el) => {
        el.style.fontFamily = `${font.family}, "Times New Roman", serif`;
        el.style.fontWeight = font.weight;
      });
      wrap.appendChild(node);
    });
  </script>
</body>
</html>
